name: Unpack any ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          set -e
          ls ./*.zip
          for z in ./*.zip; do
            unzip -o "$z" -x ".github/*"
            rm "$z"
          done

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update Kaminga"
          git push
